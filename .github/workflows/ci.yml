name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Tests never touch a real Claude binary, account or credentials: every
# integration test builds a disposable fixture with a fake `claude` written in
# Python (shebang `#!/usr/bin/python3`).
#
# The toolchain channel is read from rust-toolchain.toml so the pin lives in
# one place; rustup then also selects it through that file.

jobs:
  linux:
    name: Linux (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: toolchain
        name: Read pinned toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check test prerequisites
        run: /usr/bin/python3 --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  macos:
    name: macOS (build, clippy, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - id: toolchain
        name: Read pinned toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      # /usr/bin/python3 is the Xcode Command Line Tools shim on macOS
      # runners, so the fake `claude` fixtures can execute.
      - name: Check test prerequisites
        run: /usr/bin/python3 --version
      # Not yet expected to pass: Linux is the only verified platform.
      # tests/cli.rs reads procfs (/proc/self/fd/* in the fake Desktop,
      # /proc/sys/kernel/hostname, /proc/<pid>/stat), and src/desktop.rs only
      # discovers running Claude Desktop processes through /proc on Linux, so
      # the Desktop-related tests assume Linux behavior. Non-blocking until
      # those tests are made portable or gated by target_os.
      - name: cargo test (non-blocking)
        continue-on-error: true
        run: cargo test --locked

  windows:
    name: Windows (build, clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - id: toolchain
        name: Read pinned toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The Windows storage backend is a fail-closed stub and the integration
      # tests are #![cfg(unix)], so only build and lint here.
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
