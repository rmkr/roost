name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'push' || github.event.created
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version and commit
        id: release
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "roost-claude") | .version')
          tag="v$version"
          commit=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo version ($tag)."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
              echo "::error::The tagged commit $commit is not on main."
              exit 1
            fi
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable version in vMAJOR.MINOR.PATCH format, got $tag."
            exit 1
          fi
          printf 'tag=%s\ncommit=%s\n' "$tag" "$commit" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked --bin roost --target "$BUILD_TARGET"
        shell: bash
      - name: Package and smoke test the binary
        id: package
        shell: bash
        run: |
          staging=$(mktemp -d)
          mkdir -p release "$staging/package" "$staging/extracted"
          cp "target/$BUILD_TARGET/release/roost" LICENSE "$staging/package/"
          archive="release/roost-$RELEASE_TAG-$BUILD_TARGET.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C "$staging/package" roost LICENSE
          tar -xzf "$archive" -C "$staging/extracted"
          actual_version=$("$staging/extracted/roost" --version)
          if [[ "$actual_version" != "${RELEASE_TAG#v}" ]]; then
            echo "::error::Packaged binary reports $actual_version, expected ${RELEASE_TAG#v}."
            exit 1
          fi
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: roost-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    if: github.event_name == 'push' && github.event.created
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: roost-*
          path: release
          merge-multiple: true
      - name: Publish verified release assets
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          releases="repos/$GH_REPO/releases"
          matching=$(gh api --paginate "$releases?per_page=100" \
            | jq -sc --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]')
          if jq -e 'any(.[]; .draft == false)' <<< "$matching" >/dev/null; then
            echo "Release $RELEASE_TAG is already published."
            exit 0
          fi
          if jq -e 'length > 1' <<< "$matching" >/dev/null; then
            echo "::error::Multiple draft releases are using $RELEASE_TAG."
            exit 1
          fi

          verify_tag() {
            local remote_commit
            remote_commit=$(gh api "repos/$GH_REPO/commits/refs/tags/$RELEASE_TAG" --jq .sha)
            if [[ "$remote_commit" != "$RELEASE_COMMIT" ]]; then
              echo "::error::Tag $RELEASE_TAG no longer points to the built commit $RELEASE_COMMIT."
              exit 1
            fi
          }

          archives=(
            "roost-$RELEASE_TAG-aarch64-apple-darwin.tar.gz"
            "roost-$RELEASE_TAG-x86_64-apple-darwin.tar.gz"
            "roost-$RELEASE_TAG-aarch64-unknown-linux-gnu.tar.gz"
            "roost-$RELEASE_TAG-x86_64-unknown-linux-gnu.tar.gz"
          )
          sha256sum "${archives[@]}" > SHA256SUMS
          assets=("${archives[@]}" SHA256SUMS)

          verify_tag
          release_id=$(jq -r '.[0].id // empty' <<< "$matching")
          if [[ -z "$release_id" ]]; then
            install_notes="[Install Roost from a release or build from source]($GITHUB_SERVER_URL/$GH_REPO/blob/$RELEASE_TAG/README.md#install-from-a-release)."
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Roost $RELEASE_TAG" --notes "$install_notes" --generate-notes
            release_id=$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)
          fi

          # A failed upload leaves a draft. Replace the draft's release assets on retry.
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          expected=$(sha256sum "${assets[@]}" | awk '{print $2 "\tuploaded\tsha256:" $1}' | LC_ALL=C sort)
          uploaded=$(gh api --paginate "$releases/$release_id/assets" \
            --jq '.[] | [.name, .state, .digest] | @tsv' | LC_ALL=C sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$uploaded")
          verify_tag
          gh api --method PATCH "$releases/$release_id" -F draft=false --jq .html_url
