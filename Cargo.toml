[package]
name = "roost-claude"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Manage Claude profiles alongside your existing installation"
repository = "https://github.com/rmkr/roost"

[[bin]]
name = "roost"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process", "termios"] }
libc = "0.2"
