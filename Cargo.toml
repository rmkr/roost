[package]
name = "roost-claude"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Manage Claude profiles alongside your existing installation"
repository = "https://github.com/rmkr/roost"

[[bin]]
name = "roost"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process", "termios", "stdio"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Environment", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
